<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HudaWaNour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat@latest/dist/style.css" />
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(66, 135, 245, 0.45), transparent 55%),
                radial-gradient(circle at 90% 15%, rgba(85, 224, 216, 0.5), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 180, 189, 0.4), transparent 50%),
                #0f172a;
            --accent-gradient: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%);
            --accent-gradient-hover: linear-gradient(135deg, #91eae4 0%, #7f7fd5 100%);
            --card-bg: rgba(15, 23, 42, 0.55);
            --card-border: rgba(148, 163, 209, 0.25);

            /* n8n chat theming */
            --chat--font-family: "Poppins", "Segoe UI", Arial, sans-serif;
            --chat--color-primary: #5ee7df;
            --chat--color-primary-shade-50: #4bd8cf;
            --chat--color-primary-shade-100: #3acaba;
            --chat--color-secondary: #7f7fd5;
            --chat--color-white: #ffffff;
            --chat--color-light: #f8fafc;
            --chat--color-light-shade-50: rgba(148, 163, 209, 0.22);
            --chat--color-light-shade-100: rgba(148, 163, 209, 0.4);
            --chat--color-medium: #64748b;
            --chat--color-dark: #0b1220;
            --chat--color-disabled: rgba(100, 116, 139, 0.45);

            --chat--toggle--background: var(--chat--color-primary);
            --chat--toggle--hover--background: var(--chat--color-primary-shade-50);
            --chat--toggle--active--background: var(--chat--color-primary-shade-100);
            --chat--toggle--color: var(--chat--color-dark);

            --chat--window--background: rgba(255, 255, 255, 0.97);
            --chat--window--color: #0b1220;
            --chat--window--width: 360px;
            --chat--window--height: 520px;
            --chat--border-radius: 18px;
            --chat--shadow: 0 18px 50px rgba(15, 23, 42, 0.35);

            --chat--header--background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%);
            --chat--header--color: #0b1220;
            --chat--header--border-bottom: none;

            --chat--message--font-size: 0.95rem;
            --chat--message--bot--background: #f2f6ff;
            --chat--message--bot--color: #111827;
            --chat--message--user--background: #e5f6f4;
            --chat--message--user--color: #0b1220;
            --chat--message--metadata--color: rgba(71, 85, 105, 0.85);

            --chat--textarea--background: rgba(245, 247, 255, 0.95);
            --chat--textarea--color: #0b1220;
            --chat--textarea--placeholder-color: rgba(71, 85, 105, 0.55);
            --chat--textarea--border: 1px solid rgba(94, 231, 223, 0.35);
            --chat--textarea--focus-border: 1px solid rgba(94, 231, 223, 0.6);

            --chat--button--background: var(--chat--color-secondary);
            --chat--button--color: #ffffff;
            --chat--button--hover--background: #6a6ac8;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Poppins", "Segoe UI", Arial, sans-serif;
            color: #f8fafc;
        }

        body {
            background: var(--bg-gradient);
            position: relative;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(0.5px);
            opacity: 0.8;
            mix-blend-mode: screen;
            animation: drift 18s infinite ease-in-out;
        }

        .orb::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: inherit;
            filter: blur(12px);
            opacity: 0.9;
        }

        .orb:nth-child(1) {
            top: 12%;
            left: 8%;
            background: radial-gradient(circle at 30% 30%, rgba(83, 231, 255, 0.9), rgba(14, 116, 144, 0.2));
            animation-duration: 24s;
        }

        .orb:nth-child(2) {
            top: 65%;
            left: 72%;
            background: radial-gradient(circle at 70% 70%, rgba(255, 175, 204, 0.85), rgba(145, 65, 172, 0.25));
            animation-duration: 28s;
            animation-delay: 3s;
        }

        .orb:nth-child(3) {
            top: 40%;
            left: 25%;
            background: radial-gradient(circle at 20% 80%, rgba(123, 237, 159, 0.9), rgba(72, 149, 239, 0.25));
            animation-duration: 22s;
            animation-delay: 6s;
        }

        .orb:nth-child(4) {
            top: 78%;
            left: -8%;
            background: radial-gradient(circle at 50% 50%, rgba(246, 114, 128, 0.75), rgba(255, 221, 225, 0.25));
            animation-duration: 27s;
            animation-delay: 8s;
        }

        .orb:nth-child(5) {
            top: -10%;
            left: 60%;
            background: radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.75), rgba(58, 123, 213, 0.3));
            animation-duration: 30s;
            animation-delay: 12s;
        }

        @keyframes drift {
            0% {
                transform: translate3d(0, 0, 0) scale(0.95);
                opacity: 0.7;
            }
            25% {
                transform: translate3d(60px, -40px, 0) scale(1.05);
                opacity: 0.85;
            }
            50% {
                transform: translate3d(-80px, 30px, 0) scale(1.1);
                opacity: 0.65;
            }
            75% {
                transform: translate3d(50px, 60px, 0) scale(1.03);
                opacity: 0.9;
            }
            100% {
                transform: translate3d(0, 0, 0) scale(0.95);
                opacity: 0.7;
            }
        }

        .radio-link {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: #0b1220;
            background: var(--accent-gradient);
            box-shadow: 0 12px 24px rgba(94, 231, 223, 0.3), 0 4px 12px rgba(17, 24, 39, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.5s ease;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .radio-link:hover {
            transform: translateY(-4px) scale(1.02);
            background: var(--accent-gradient-hover);
            box-shadow: 0 16px 32px rgba(145, 234, 228, 0.35), 0 6px 16px rgba(17, 24, 39, 0.3);
        }

        .radio-link::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(94, 231, 223, 0.25), rgba(180, 144, 202, 0));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .radio-link:hover::after {
            opacity: 1;
        }

        .radio-link span {
            font-size: 0.75rem;
            display: inline-flex;
            flex-direction: column;
            line-height: 1.05;
            text-transform: none;
            letter-spacing: 0;
            opacity: 0.9;
        }

        .radio-link span strong {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .radio-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            display: grid;
            place-items: center;
        }

        .radio-icon::before {
            content: "\1F3A7";
            font-size: 1.1rem;
        }

        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .logo-frame {
            position: relative;
            padding: 36px;
            border-radius: 32px;
            backdrop-filter: blur(18px);
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.45), rgba(30, 41, 59, 0.2));
            box-shadow: 0 20px 45px rgba(10, 17, 35, 0.45);
            overflow: hidden;
        }

        .logo-frame::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(94, 231, 223, 0.15), transparent 65%);
            opacity: 0.7;
            pointer-events: none;
        }

        .logo-frame::after {
            content: "";
            position: absolute;
            inset: -120px;
            background: conic-gradient(from 180deg, rgba(94, 231, 223, 0.25), rgba(180, 144, 202, 0.1), rgba(94, 231, 223, 0.25));
            animation: rotateGlow 14s linear infinite;
            opacity: 0.35;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        img {
            max-width: min(65vw, 540px);
            max-height: min(65vh, 540px);
            display: block;
            border-radius: 24px;
            position: relative;
            z-index: 1;
            box-shadow: 0 18px 45px rgba(8, 11, 26, 0.4);
            transition: transform 8s ease-in-out, filter 0.6s ease;
        }

        img:hover {
            transform: scale(1.03);
            filter: saturate(1.1);
        }

        .platform-panel {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            width: min(90vw, 480px);
            z-index: 3;
        }

        .platform-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 24px;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            backdrop-filter: blur(16px);
            box-shadow: 0 14px 32px rgba(8, 11, 26, 0.35);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .platform-card:hover {
            transform: translateY(-6px);
            border-color: rgba(94, 231, 223, 0.5);
            box-shadow: 0 20px 45px rgba(94, 231, 223, 0.2), 0 8px 16px rgba(8, 11, 26, 0.4);
        }

        .platform-card:hover .badge-circle {
            transform: scale(1.08) rotate(5deg);
        }

        .badge-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: visible;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .badge-tunein {
            background: linear-gradient(135deg, #5ee7df 0%, #4895f5 50%, #b490ca 100%);
            box-shadow: 0 8px 24px rgba(94, 231, 223, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .badge-tunein::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), transparent);
            z-index: 1;
        }

        .tunein-icon {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .tunein-waves {
            display: flex;
            gap: 3px;
            align-items: flex-end;
        }

        .tunein-wave {
            width: 4px;
            background: linear-gradient(to top, #0a1428, #ffffff);
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .tunein-wave:nth-child(1) { height: 14px; animation-delay: 0s; }
        .tunein-wave:nth-child(2) { height: 22px; animation-delay: 0.1s; }
        .tunein-wave:nth-child(3) { height: 18px; animation-delay: 0.2s; }
        .tunein-wave:nth-child(4) { height: 24px; animation-delay: 0.3s; }
        .tunein-wave:nth-child(5) { height: 16px; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); opacity: 0.7; }
            50% { transform: scaleY(1.4); opacity: 1; }
        }

        .badge-alexa {
            background: linear-gradient(135deg, #5ee7df 0%, #7f7fd5 50%, #b490ca 100%);
            box-shadow: 0 8px 24px rgba(127, 127, 213, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .badge-alexa::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.2), transparent);
            z-index: 1;
        }

        .alexa-icon {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .alexa-ring {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.8), rgba(10, 20, 40, 0.95));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .alexa-ring::before {
            content: "";
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #5ee7df, transparent);
            border-radius: 2px;
            animation: alexa-pulse 2s ease-in-out infinite;
        }

        .alexa-wave {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        .alexa-bar {
            width: 2.5px;
            background: linear-gradient(to top, #5ee7df, #91eae4);
            border-radius: 2px;
            animation: alexa-wave 1s ease-in-out infinite;
        }

        .alexa-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .alexa-bar:nth-child(2) { height: 12px; animation-delay: 0.1s; }
        .alexa-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
        .alexa-bar:nth-child(4) { height: 14px; animation-delay: 0.3s; }
        .alexa-bar:nth-child(5) { height: 9px; animation-delay: 0.4s; }

        @keyframes alexa-wave {
            0%, 100% { transform: scaleY(0.7); opacity: 0.6; }
            50% { transform: scaleY(1.3); opacity: 1; }
        }

        @keyframes alexa-pulse {
            0%, 100% { opacity: 0.4; transform: translateX(-50%) scaleX(0.8); }
            50% { opacity: 1; transform: translateX(-50%) scaleX(1); }
        }

        .platform-details {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .platform-name {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.02em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .platform-tagline {
            font-size: 0.78rem;
            color: rgba(226, 232, 240, 0.75);
            line-height: 1.4;
        }

        #n8n-support-chat {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
        }

        @media (max-width: 768px) {
            .radio-link {
                top: 18px;
                right: 18px;
                padding: 10px 18px;
                font-size: 0.85rem;
            }

            .center-container {
                padding: 24px;
            }

            .logo-frame {
                padding: 24px;
                border-radius: 24px;
            }

            img {
                max-width: 80vw;
                border-radius: 18px;
            }

            .platform-panel {
                bottom: -3px;
                width: min(92vw, 420px);
                gap: 16px;
            }

            .platform-card {
                padding: 16px;
            }

            .badge-circle {
                width: 68px;
                height: 68px;
            }

            #n8n-support-chat {
                bottom: 16px;
                right: 16px;
            }
        }

        @media (max-width: 580px) {
            .platform-panel {
                flex-direction: column;
                gap: 14px;
                width: min(92vw, 360px);
            }

            .platform-card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>

    <a class="radio-link" href="https://online.radiohudawanour.com/listen/hudawanour/live" target="_blank" rel="noopener">
        <span class="radio-icon"></span>
        <span>
            <strong>Listen Live</strong>
            Stream Now
        </span>
    </a>

    <div class="center-container">
        <div class="logo-frame">
            <img src="logo.jpg" alt="Logo" />
        </div>
    </div>

    <div class="platform-panel">
        <a class="platform-card" href="https://tunein.com/radio/HudaWaNour-s347430/" target="_blank" rel="noopener">
            <div class="badge-circle badge-tunein">
                <div class="tunein-icon">
                    <div class="tunein-waves">
                        <div class="tunein-wave"></div>
                        <div class="tunein-wave"></div>
                        <div class="tunein-wave"></div>
                        <div class="tunein-wave"></div>
                        <div class="tunein-wave"></div>
                    </div>
                </div>
            </div>
            <div class="platform-details">
                <span class="platform-name">TuneIn</span>
                <span class="platform-tagline">Listen on TuneIn Radio</span>
            </div>
        </a>
        <a class="platform-card" href="https://www.amazon.com/dp/B0FF48HY15/" target="_blank" rel="noopener">
            <div class="badge-circle badge-alexa">
                <div class="alexa-icon">
                    <div class="alexa-ring">
                        <div class="alexa-wave">
                            <div class="alexa-bar"></div>
                            <div class="alexa-bar"></div>
                            <div class="alexa-bar"></div>
                            <div class="alexa-bar"></div>
                            <div class="alexa-bar"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="platform-details">
                <span class="platform-name">Amazon Alexa</span>
                <span class="platform-tagline">Enable the Alexa skill</span>
            </div>
        </a>
    </div>

    <div id="n8n-support-chat"></div>

    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat@latest/dist/chat.bundle.es.js';

        createChat({
            webhookUrl: 'https://n8n.khattabi.ly/webhook/de2ac704-e7d2-46e3-b718-c575b1d3e573/chat',
            target: '#n8n-support-chat',
            mode: 'window',
            showWelcomeScreen: false,
            loadPreviousSession: true,
            initialMessages: [
                {
                    text: 'As-salamu alaykum! I can help you explore Sahih Bukhari, Sahih Muslim, and the Qur’an. Ask away!',
                    sender: 'bot'
                }
            ],
            metadata: {
                source: 'HudaWaNour-site'
            },
            i18n: {
                en: {
                    title: 'HudaWaNour Companion',
                    subtitle: 'I know Sahih Bukhari, Muslim and the Qur’an. Ask away!',
                    getStarted: 'Start chatting',
                    inputPlaceholder: 'Type your message...'
                }
            }
        });
    </script>
</body>
</html>
