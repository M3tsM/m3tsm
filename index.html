<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HudaWaNour</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(66, 135, 245, 0.45), transparent 55%),
                radial-gradient(circle at 90% 15%, rgba(85, 224, 216, 0.5), transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 180, 189, 0.4), transparent 50%),
                #0f172a;
            --accent-gradient: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%);
            --accent-gradient-hover: linear-gradient(135deg, #91eae4 0%, #7f7fd5 100%);
        }

        /* Basic reset and layout */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Poppins", "Segoe UI", Arial, sans-serif;
            color: #f8fafc;
        }

        body {
            background: var(--bg-gradient);
            position: relative;
            overflow: hidden;
        }

        /* Animated background orbs */
        .orb {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(0.5px);
            opacity: 0.8;
            mix-blend-mode: screen;
            animation: drift 18s infinite ease-in-out;
        }

        .orb::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: inherit;
            filter: blur(12px);
            opacity: 0.9;
        }

        .orb:nth-child(1) {
            top: 12%;
            left: 8%;
            background: radial-gradient(circle at 30% 30%, rgba(83, 231, 255, 0.9), rgba(14, 116, 144, 0.2));
            animation-duration: 24s;
        }

        .orb:nth-child(2) {
            top: 65%;
            left: 72%;
            background: radial-gradient(circle at 70% 70%, rgba(255, 175, 204, 0.85), rgba(145, 65, 172, 0.25));
            animation-duration: 28s;
            animation-delay: 3s;
        }

        .orb:nth-child(3) {
            top: 40%;
            left: 25%;
            background: radial-gradient(circle at 20% 80%, rgba(123, 237, 159, 0.9), rgba(72, 149, 239, 0.25));
            animation-duration: 22s;
            animation-delay: 6s;
        }

        .orb:nth-child(4) {
            top: 78%;
            left: -8%;
            background: radial-gradient(circle at 50% 50%, rgba(246, 114, 128, 0.75), rgba(255, 221, 225, 0.25));
            animation-duration: 27s;
            animation-delay: 8s;
        }

        .orb:nth-child(5) {
            top: -10%;
            left: 60%;
            background: radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.75), rgba(58, 123, 213, 0.3));
            animation-duration: 30s;
            animation-delay: 12s;
        }

        @keyframes drift {
            0% {
                transform: translate3d(0, 0, 0) scale(0.95);
                opacity: 0.7;
            }
            25% {
                transform: translate3d(60px, -40px, 0) scale(1.05);
                opacity: 0.85;
            }
            50% {
                transform: translate3d(-80px, 30px, 0) scale(1.1);
                opacity: 0.65;
            }
            75% {
                transform: translate3d(50px, 60px, 0) scale(1.03);
                opacity: 0.9;
            }
            100% {
                transform: translate3d(0, 0, 0) scale(0.95);
                opacity: 0.7;
            }
        }

        /* Radio link */
        .radio-link {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: #0b1220;
            background: var(--accent-gradient);
            box-shadow: 0 12px 24px rgba(94, 231, 223, 0.3), 0 4px 12px rgba(17, 24, 39, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.5s ease;
            z-index: 3;
        }

        .radio-link:hover {
            transform: translateY(-4px) scale(1.02);
            background: var(--accent-gradient-hover);
            box-shadow: 0 16px 32px rgba(145, 234, 228, 0.35), 0 6px 16px rgba(17, 24, 39, 0.3);
        }

        .radio-link::after {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(94, 231, 223, 0.25), rgba(180, 144, 202, 0));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .radio-link:hover::after {
            opacity: 1;
        }

        .radio-link span {
            margin-left: 8px;
            font-size: 0.75rem;
            display: inline-block;
            vertical-align: middle;
            opacity: 0.9;
        }

        /* Centered image styling */
        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .logo-frame {
            position: relative;
            padding: 36px;
            border-radius: 32px;
            backdrop-filter: blur(18px);
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.45), rgba(30, 41, 59, 0.2));
            box-shadow: 0 20px 45px rgba(10, 17, 35, 0.45);
            overflow: hidden;
        }

        .logo-frame::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(94, 231, 223, 0.15), transparent 65%);
            opacity: 0.7;
            pointer-events: none;
        }

        .logo-frame::after {
            content: "";
            position: absolute;
            inset: -120px;
            background: conic-gradient(from 180deg, rgba(94, 231, 223, 0.25), rgba(180, 144, 202, 0.1), rgba(94, 231, 223, 0.25));
            animation: rotateGlow 14s linear infinite;
            opacity: 0.35;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        img {
            max-width: min(65vw, 540px);
            max-height: min(65vh, 540px);
            display: block;
            border-radius: 24px;
            position: relative;
            z-index: 1;
            box-shadow: 0 18px 45px rgba(8, 11, 26, 0.4);
            transition: transform 8s ease-in-out, filter 0.6s ease;
        }

        img:hover {
            transform: scale(1.03);
            filter: saturate(1.1);
        }

        /* Responsive tweaks */
        @media (max-width: 768px) {
            .radio-link {
                top: 18px;
                right: 18px;
                padding: 10px 18px;
                font-size: 0.85rem;
            }

            .center-container {
                padding: 24px;
            }

            .logo-frame {
                padding: 24px;
                border-radius: 24px;
            }

            img {
                max-width: 80vw;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Ambient floating orbs -->
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>

    <!-- Radio link -->
    <a class="radio-link" href="https://online.radiohudawanour.com/listen/hudawanour/live" target="_blank" rel="noopener">
        🎧 Listen Live <span>Tap to tune in</span>
    </a>

    <!-- Centered logo -->
    <div class="center-container">
        <div class="logo-frame">
            <img src="logo.jpg" alt="Logo" />
        </div>
    </div>
</body>
</html>
